name: Cheat sheets generate

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'phases/**'
      - 'manuals/**'
      - 'projects/**'
      - 'cheatsheets/topics.yaml'
  workflow_dispatch:
    inputs:
      topics:
        description: 'Topic ids to write again, separated by spaces. Leave empty to write the missing and stale topics.'
        required: false
        default: ''
      model:
        description: 'Model for the writer'
        required: false
        default: 'sonnet'
        type: choice
        options:
          - sonnet
          - opus
      limit:
        description: 'Largest number of topics in one run'
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cheatsheets-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Cheat sheets::ANTHROPIC_API_KEY is not set. Add it as a repository secret to turn on cheat sheet generation. Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: steps.key.outputs.ready == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: '24'
      - name: Find the missing and stale topics
        id: plan
        if: steps.key.outputs.ready == 'true'
        env:
          TOPICS: ${{ inputs.topics }}
          LIMIT: ${{ inputs.limit || '20' }}
        run: |
          set -euo pipefail
          node site/build-cheatsheets.js --status > "$RUNNER_TEMP/status.json"
          if [ -n "$TOPICS" ]; then
            ids="$TOPICS"
          else
            ids="$(node -e 'const s=require(process.argv[1]);console.log([...s.missing,...s.stale].join(" "))' "$RUNNER_TEMP/status.json")"
          fi
          ids="$(echo $ids | tr ' ' '\n' | grep -E '^[a-z0-9-]+$' | head -n "$LIMIT" | tr '\n' ' ')"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          if [ -z "$ids" ]; then echo "::notice title=Cheat sheets::Every topic has a current sheet. Nothing to do."; fi
      - name: Install the writer tools outside the repository
        if: steps.key.outputs.ready == 'true' && steps.plan.outputs.ids != ''
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/gen" @anthropic-ai/sdk@0.134.0
      - name: Write the sheets
        id: write
        if: steps.key.outputs.ready == 'true' && steps.plan.outputs.ids != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NODE_PATH: ${{ runner.temp }}/gen/node_modules
          IDS: ${{ steps.plan.outputs.ids }}
          MODEL: ${{ inputs.model || 'sonnet' }}
        run: |
          set -uo pipefail
          node scripts/cheatsheets/generate.js $IDS --model "$MODEL" --summary "$RUNNER_TEMP/summary.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Run the cheat sheet gates
        if: steps.key.outputs.ready == 'true' && steps.plan.outputs.ids != ''
        run: |
          set -euo pipefail
          node --test site/test_cheatsheets.js site/test_cheatsheet_topics.js scripts/cheatsheets/test_generate.js
          node site/build-cheatsheets.js --check
          git checkout -- site/data.js 2>/dev/null || true
      - name: Open a pull request for review
        if: steps.key.outputs.ready == 'true' && steps.plan.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ inputs.model || 'sonnet' }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- cheatsheets)" ]; then
            echo "::notice title=Cheat sheets::No sheet changed."
            exit 0
          fi
          branch="cheatsheets/auto-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add cheatsheets
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const lines = [
              "Cheat sheets written by scripts/cheatsheets/generate.js with " + s.model + ".",
              "",
              "Written and checked: " + (s.written.join(", ") || "none") + ".",
              "",
              s.failed.length ? "Not written, because the check still failed after two retries:" : "Every requested topic passed the check.",
              ...s.failed.map(f => "- " + f.id + ": " + f.problems.slice(0, 3).join(" | ")),
              "",
              "Each sheet passed the literal fact check, the two-page limit and the cheat sheet tests. Read each sheet and its evidence file before you merge.",
            ];
            fs.writeFileSync(process.argv[2], lines.join("\n") + "\n");
            fs.writeFileSync(process.argv[3], "chore(cheatsheets): write " + s.written.length + " sheets\n\nWritten by scripts/cheatsheets/generate.js with " + s.model + ".\n");
          ' "$RUNNER_TEMP/summary.json" "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/commit.txt"
          git commit -q -F "$RUNNER_TEMP/commit.txt"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(cheatsheets): new and updated sheets" --body-file "$RUNNER_TEMP/body.md"
